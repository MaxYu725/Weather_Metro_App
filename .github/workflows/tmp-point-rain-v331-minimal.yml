name: Temporary Point Rain V3.3.1 minimal
on: push
jobs:
  patch:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/visual-v3.3-point-rain
      - name: Patch source
        shell: bash
        run: |
          python3 -c "from pathlib import Path; import base64; p=Path('app/src/main/java/com/weather/metro/ui/rain/RainPointPanel.kt'); s=p.read_text(); s=s.replace('import androidx.compose.foundation.LocalIndication\\nimport androidx.compose.foundation.clickable\\n','import androidx.compose.foundation.LocalIndication\\nimport androidx.compose.foundation.background\\nimport androidx.compose.foundation.clickable\\n'); s=s.replace('import androidx.compose.foundation.layout.fillMaxWidth\\n','import androidx.compose.foundation.layout.fillMaxSize\\nimport androidx.compose.foundation.layout.fillMaxWidth\\n'); s=s.replace('import androidx.compose.material3.Text\\n','import androidx.compose.foundation.shape.RoundedCornerShape\\nimport androidx.compose.material3.Text\\n'); old=base64.b64decode('').decode(); new=base64.b64decode('').decode(); assert old in s, 'radius anchor missing'; p.write_text(s.replace(old,new,1))"
          python3 -c "from pathlib import Path; import base64; p=Path('app/src/main/java/com/weather/metro/ui/tools/NativeToolsScreen.kt'); s=p.read_text(); a='import com.weather.metro.ui.components.MetroTile\\n'; b=a+'import com.weather.metro.ui.map.HongKongBackdrop\\nimport com.weather.metro.ui.map.HongKongMapAttribution\\n'; s=s if 'import com.weather.metro.ui.map.HongKongBackdrop' in s else s.replace(a,b,1); old=base64.b64decode('').decode(); new=base64.b64decode('').decode(); assert old in s, 'PointToolScreen anchor missing'; p.write_text(s.replace(old,new,1))"
      - name: Commit source
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "MaxYu725"
          git config user.email "maxyu0725@outlook.com"
          git add app/src/main/java/com/weather/metro/ui/rain/RainPointPanel.kt app/src/main/java/com/weather/metro/ui/tools/NativeToolsScreen.kt
          git commit -m "fix: strengthen Point Rain selection and map backdrop"
          git push origin HEAD:feature/visual-v3.3-point-rain
