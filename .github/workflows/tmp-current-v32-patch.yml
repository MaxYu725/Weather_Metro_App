name: Temporary Current V3.2 patch

on:
  push:
    branches:
      - feature/visual-v3.2-current

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/visual-v3.2-current
      - name: Apply guarded Current V3.2 patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/weather/metro/ui/screens/HomeCurrentScreen.kt')
          text = path.read_text()
          if 'import com.weather.metro.ui.components.MetroGlassContextSurface' in text:
              print('Current V3.2 patch already applied')
              raise SystemExit(0)
          old = 'import com.weather.metro.ui.components.ExpandableMetroTile\nimport com.weather.metro.ui.components.HkoRemoteImage\n'
          new = 'import com.weather.metro.ui.components.ExpandableMetroTile\nimport com.weather.metro.ui.components.HkoRemoteImage\nimport com.weather.metro.ui.components.MetroGlassContextSurface\n'
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          old = '        item {\n            Row(\n                modifier = Modifier.fillMaxWidth().padding(bottom = 4.dp),\n                verticalAlignment = Alignment.CenterVertically,\n            ) {'
          new = '        item {\n            val syncAccent = if (snapshot.isStale) Color(0xFFF09609) else pageColour\n            MetroGlassContextSurface(\n                accent = syncAccent,\n                modifier = Modifier.fillMaxWidth(),\n            ) {\n                Row(\n                    modifier = Modifier.fillMaxWidth().padding(horizontal = 12.dp, vertical = 8.dp),\n                    verticalAlignment = Alignment.CenterVertically,\n                ) {'
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          old = '                    modifier = if (refreshing) Modifier else Modifier.clickable(onClick = onRefresh),\n                )\n            }\n        }\n\n        item {\n            ExpandableMetroTile('
          new = '                    modifier = if (refreshing) Modifier else Modifier.clickable(onClick = onRefresh),\n                )\n                }\n            }\n        }\n\n        item {\n            ExpandableMetroTile('
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          old = '                        Text(if (heroExpanded) "−" else "+", color = Color.White, fontSize = 25.sp)\n'
          assert text.count(old) == 1
          text = text.replace(old, '                        HomeDetailBadge(heroExpanded, pageColour)\n', 1)
          old = '                        Text(if (localForecastExpanded) "−" else "+", color = Color.White, fontSize = 25.sp)\n'
          assert text.count(old) == 1
          text = text.replace(old, '                        HomeDetailBadge(localForecastExpanded, pageColour)\n', 1)
          anchor = 'private data class HomeRainSample(\n'
          helper = '@Composable\nprivate fun HomeDetailBadge(expanded: Boolean, pageColour: Color) {\n    MetroGlassContextSurface(accent = pageColour) {\n        Box(\n            modifier = Modifier.width(42.dp).height(28.dp),\n            contentAlignment = Alignment.Center,\n        ) {\n            Text(\n                text = if (expanded) "收起" else "詳情",\n                color = Color.White.copy(alpha = 0.86f),\n                fontSize = 10.sp,\n                maxLines = 1,\n            )\n        }\n    }\n}\n\nprivate data class HomeRainSample(\n'
          assert text.count(anchor) == 1
          text = text.replace(anchor, helper, 1)
          path.write_text(text)
          PY
      - name: Commit Current V3.2 source when changed
        shell: bash
        run: |
          if git diff --quiet -- app/src/main/java/com/weather/metro/ui/screens/HomeCurrentScreen.kt; then
            echo "No source changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/weather/metro/ui/screens/HomeCurrentScreen.kt
          git diff --cached --check
          git commit -m "Visual V3.2: modernize Current status and detail controls"
          git push origin HEAD:feature/visual-v3.2-current
