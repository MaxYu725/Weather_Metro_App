name: Apply primary sync status layout

on:
  push:
    branches:
      - feature/primary-sync-status

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/primary-sync-status

      - name: Apply layout changes
        run: python3 .github/scripts/apply_primary_sync_status.py

      - name: Commit applied change
        run: |
          rm .github/workflows/apply-primary-sync-status.yml
          rm .github/scripts/apply_primary_sync_status.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply primary sync status layout"
          git push origin HEAD:feature/primary-sync-status
