name: Temporary Visual V3.4 patch
on:
  push:
    branches:
      - feature/visual-v3.4-two-hour-forecast

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/visual-v3.4-two-hour-forecast
      - name: Apply guarded V3.4 source patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              if old in text:
                  return text.replace(old, new, 1)
              if new in text:
                  return text
              raise SystemExit(f'anchor missing: {label}')

          def sub_once(text, pattern, replacement, label):
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count == 1:
                  return updated
              if replacement in text:
                  return text
              raise SystemExit(f'function boundary missing: {label}')

          rain_path = Path('app/src/main/java/com/weather/metro/ui/rain/RainForecastMapLibre.kt')
          rain = rain_path.read_text()
          rain = replace_once(rain, 'import androidx.compose.material3.Text\n', 'import androidx.compose.foundation.shape.RoundedCornerShape\nimport androidx.compose.material3.Text\n', 'RoundedCornerShape import')
          rain = replace_once(rain, 'import androidx.compose.ui.graphics.Color\n', 'import androidx.compose.ui.graphics.Brush\nimport androidx.compose.ui.graphics.Color\n', 'Brush import')
          rain = replace_once(rain, 'import com.weather.metro.domain.rain.RainForecastTimeline\n', 'import com.weather.metro.domain.rain.RainForecastTimeline\nimport com.weather.metro.ui.components.MetroGlassContextSurface\n', 'Glass import')
          rain = rain.replace('private val MAPLIBRE_PANEL = Color(0xF20A0A0A)\n', '')
          rain = replace_once(
              rain,
              '''        MapLibreZoomControls(\n            map = map,\n            modifier = Modifier\n''',
              '''        MapLibreZoomControls(\n            map = map,\n            accent = markerColour,\n            modifier = Modifier\n''',
              'zoom accent call',
          )
          rain = replace_once(
              rain,
              '''private fun MapLibreZoomControls(\n    map: MapLibreMap?,\n    modifier: Modifier = Modifier,\n) {\n''',
              '''private fun MapLibreZoomControls(\n    map: MapLibreMap?,\n    accent: Color,\n    modifier: Modifier = Modifier,\n) {\n''',
              'zoom signature',
          )
          rain = replace_once(rain, '        MapLibreMapControl("+") {\n', '        MapLibreMapControl("+", accent) {\n', 'zoom plus')
          rain = replace_once(rain, '        MapLibreMapControl("−") {\n', '        MapLibreMapControl("−", accent) {\n', 'zoom minus')

          map_control = '''@Composable
          private fun MapLibreMapControl(label: String, accent: Color, onClick: () -> Unit) {
              MetroGlassContextSurface(
                  accent = accent,
                  modifier = Modifier
                      .size(42.dp)
                      .clickable(onClick = onClick),
              ) {
                  Text(label, color = Color.White, fontSize = 22.sp, fontWeight = FontWeight.Light)
              }
          }

          @Composable
          private fun MapLibreTopHud'''.replace('          ', '')
          rain = sub_once(
              rain,
              r'@Composable\nprivate fun MapLibreMapControl\(.*?\n}\n\n@Composable\nprivate fun MapLibreTopHud',
              map_control,
              'MapLibreMapControl',
          )

          top_hud = '''@Composable
          private fun MapLibreTopHud(
              state: RainHostState,
              accent: Color,
              onBack: () -> Unit,
              onRefresh: () -> Unit,
              modifier: Modifier = Modifier,
          ) {
              val location = state.location?.label ?: "目前位置"
              val refreshing = state.forecast.status == RainResourceStatus.LOADING
              val timeline = state.forecast.value
              Row(
                  modifier = modifier
                      .fillMaxWidth()
                      .background(
                          brush = Brush.verticalGradient(
                              colors = listOf(
                                  Color.Black.copy(alpha = 0.78f),
                                  Color.Black.copy(alpha = 0.46f),
                                  accent.copy(alpha = 0.08f),
                                  Color.Transparent,
                              ),
                          ),
                      )
                      .padding(start = 14.dp, end = 14.dp, top = 10.dp, bottom = 18.dp),
                  verticalAlignment = Alignment.CenterVertically,
                  horizontalArrangement = Arrangement.spacedBy(12.dp),
              ) {
                  MapLibreHeaderAction("‹ 返回", accent, onBack)
                  Column(modifier = Modifier.weight(1f)) {
                      Text(
                          text = "兩小時降雨 · $location",
                          color = Color.White,
                          fontSize = 16.sp,
                          fontWeight = FontWeight.Medium,
                          maxLines = 1,
                          overflow = TextOverflow.Ellipsis,
                      )
                      Text(
                          text = when {
                              timeline == null -> "HKO 短臨預報"
                              state.forecast.isStale -> "已保留上次成功預報"
                              refreshing -> "正在更新 HKO SWIRLS…"
                              else -> "HKO SWIRLS · ${timeline.cadenceMinutes} 分鐘一格 · ${timeline.accumulationMinutes} 分鐘累積"
                          },
                          color = MAPLIBRE_MUTED,
                          fontSize = 10.sp,
                          maxLines = 1,
                          overflow = TextOverflow.Ellipsis,
                      )
                  }
                  MapLibreHeaderAction("更新", accent, onRefresh)
              }
          }

          @Composable
          private fun MapLibreHeaderAction(
              label: String,
              accent: Color,
              onClick: () -> Unit,
          ) {
              MetroGlassContextSurface(
                  accent = accent,
                  modifier = Modifier.clickable(onClick = onClick),
              ) {
                  Text(
                      text = label,
                      color = accent,
                      fontSize = 12.sp,
                      modifier = Modifier.padding(horizontal = 10.dp, vertical = 8.dp),
                  )
              }
          }

          @Composable
          private fun MapLibreTimelineHud'''.replace('          ', '')
          rain = sub_once(
              rain,
              r'@Composable\nprivate fun MapLibreTopHud\(.*?\n@Composable\nprivate fun MapLibreTimelineHud',
              top_hud,
              'MapLibreTopHud',
          )

          rain = replace_once(
              rain,
              '''    Column(\n        modifier = modifier\n            .fillMaxWidth()\n            .background(MAPLIBRE_PANEL)\n            .border(1.dp, Color(0xFF474747))\n            .padding(horizontal = 11.dp, vertical = 9.dp),\n        verticalArrangement = Arrangement.spacedBy(6.dp),\n    ) {\n''',
              '''    Column(\n        modifier = modifier\n            .fillMaxWidth()\n            .background(\n                color = Color.Black.copy(alpha = 0.70f),\n                shape = RoundedCornerShape(18.dp),\n            )\n            .border(\n                width = 1.dp,\n                color = Color.White.copy(alpha = 0.22f),\n                shape = RoundedCornerShape(18.dp),\n            )\n            .padding(horizontal = 11.dp, vertical = 9.dp),\n        verticalArrangement = Arrangement.spacedBy(6.dp),\n    ) {\n''',
              'timeline surface',
          )
          rain = replace_once(
              rain,
              '''        Row(verticalAlignment = Alignment.CenterVertically) {\n            Text("${timeline.cadenceMinutes}分鐘步進", color = Color.White, fontSize = 12.sp)\n            Spacer(Modifier.size(7.dp))\n            Text(\n                "mm / ${timeline.accumulationMinutes}分鐘",\n                color = accent,\n                fontSize = 10.sp,\n                modifier = Modifier.border(1.dp, accent.copy(alpha = 0.72f)).padding(horizontal = 5.dp, vertical = 2.dp),\n            )\n            Spacer(Modifier.weight(1f))\n            Text(\n                "${formatForecastTime(frame.windowStart)}–${formatForecastTime(frame.windowEnd)}  ${timeline.loadedFrameCount}/${timeline.frames.size}",\n                color = Color.White.copy(alpha = 0.78f),\n                fontSize = 10.sp,\n            )\n        }\n''',
              '''        Row(verticalAlignment = Alignment.CenterVertically) {\n            Text("${timeline.cadenceMinutes} 分鐘一格", color = Color.White, fontSize = 12.sp)\n            Spacer(Modifier.size(7.dp))\n            MetroGlassContextSurface(accent = accent) {\n                Text(\n                    "${timeline.accumulationMinutes} 分鐘累積",\n                    color = accent,\n                    fontSize = 9.sp,\n                    modifier = Modifier.padding(horizontal = 7.dp, vertical = 4.dp),\n                )\n            }\n            Spacer(Modifier.weight(1f))\n            Text(\n                "${formatForecastTime(frame.windowStart)}–${formatForecastTime(frame.windowEnd)} · ${timeline.loadedFrameCount}/${timeline.frames.size}",\n                color = Color.White.copy(alpha = 0.78f),\n                fontSize = 10.sp,\n            )\n        }\n''',
              'timeline labels',
          )
          rain = replace_once(
              rain,
              '''                    Column(\n                        modifier = Modifier\n                            .background(if (selected) accent else Color(0xFF101010))\n                            .border(1.dp, borderColour)\n                            .clickable { onSelectFrame(index) }\n                            .padding(horizontal = 10.dp, vertical = 6.dp),\n                        horizontalAlignment = Alignment.CenterHorizontally,\n                    ) {\n''',
              '''                    Column(\n                        modifier = Modifier\n                            .background(\n                                color = when {\n                                    selected -> accent.copy(alpha = 0.30f)\n                                    failed -> MAPLIBRE_WARNING.copy(alpha = 0.10f)\n                                    else -> Color.Black.copy(alpha = 0.38f)\n                                },\n                                shape = RoundedCornerShape(12.dp),\n                            )\n                            .border(1.dp, borderColour, RoundedCornerShape(12.dp))\n                            .clickable { onSelectFrame(index) }\n                            .padding(horizontal = 10.dp, vertical = 6.dp),\n                        horizontalAlignment = Alignment.CenterHorizontally,\n                    ) {\n''',
              'timeline chip',
          )
          rain = rain.replace(
              'text = "$source · 每${timeline.cadenceMinutes}分鐘一格 · 每格為${timeline.accumulationMinutes}分鐘累積$loadingMode$stale · MapLibre · © OSM © CARTO",',
              'text = "$source · ${timeline.cadenceMinutes} 分鐘一格 · ${timeline.accumulationMinutes} 分鐘累積$loadingMode$stale · MapLibre · © OSM © CARTO",',
          )
          rain = rain.replace('                        "retry",\n', '                        "重新載入",\n')

          compact_and_mini = '''@Composable
          private fun MapLibreCompactButton(
              label: String,
              accent: Color,
              enabled: Boolean = true,
              onClick: () -> Unit,
          ) {
              MetroGlassContextSurface(
                  accent = if (enabled) accent else Color.White.copy(alpha = 0.08f),
                  modifier = Modifier.clickable(enabled = enabled, onClick = onClick),
              ) {
                  Text(
                      text = label,
                      color = if (enabled) accent else MAPLIBRE_MUTED.copy(alpha = 0.45f),
                      fontSize = 10.sp,
                      modifier = Modifier.padding(horizontal = 7.dp, vertical = 7.dp),
                  )
              }
          }

          @Composable
          private fun MapLibreMiniButton(
              label: String,
              accent: Color,
              enabled: Boolean = true,
              onClick: () -> Unit,
          ) {
              MetroGlassContextSurface(
                  accent = if (enabled) accent else Color.White.copy(alpha = 0.08f),
                  modifier = Modifier
                      .size(26.dp)
                      .clickable(enabled = enabled, onClick = onClick),
              ) {
                  Text(label, color = if (enabled) accent else MAPLIBRE_MUTED.copy(alpha = 0.45f), fontSize = 14.sp)
              }
          }

          @Composable
          private fun MapLibreLegendCompact'''.replace('          ', '')
          rain = sub_once(
              rain,
              r'@Composable\nprivate fun MapLibreCompactButton\(.*?\n@Composable\nprivate fun MapLibreLegendCompact',
              compact_and_mini,
              'compact controls',
          )
          rain_path.write_text(rain)

          home_path = Path('app/src/main/java/com/weather/metro/ui/screens/HomeCurrentScreen.kt')
          home = home_path.read_text()
          home_tools = '''@Composable
          private fun HomeToolActions(
              pageColour: Color,
              stormState: StormHostState,
              onOpenRadar: () -> Unit,
              onOpenForecastMap: () -> Unit,
              onOpenStorm: () -> Unit,
          ) {
              Row(
                  modifier = Modifier.fillMaxWidth(),
                  horizontalArrangement = Arrangement.spacedBy(7.dp),
              ) {
                  HomeToolAction(
                      seed = "home-radar",
                      title = "降雨雷達",
                      status = "即時觀測",
                      pageColour = pageColour,
                      modifier = Modifier.weight(1f),
                      onClick = onOpenRadar,
                  )
                  HomeToolAction(
                      seed = "home-forecast-map",
                      title = "兩小時降雨",
                      status = "短臨預報",
                      pageColour = pageColour,
                      modifier = Modifier.weight(1f),
                      onClick = onOpenForecastMap,
                  )
                  HomeToolAction(
                      seed = "home-storm",
                      title = "熱帶氣旋",
                      status = if (stormState.isRefreshing) "路徑追蹤 · 更新中" else "路徑追蹤",
                      pageColour = pageColour,
                      modifier = Modifier.weight(1f),
                      onClick = onOpenStorm,
                  )
              }
          }

          @Composable
          private fun HomeToolAction'''.replace('          ', '')
          home = sub_once(
              home,
              r'@Composable\nprivate fun HomeToolActions\(.*?\n@Composable\nprivate fun HomeToolAction',
              home_tools,
              'HomeToolActions',
          )
          home_path.write_text(home)
          PY
      - name: Commit source when changed
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "MaxYu725"
          git config user.email "maxyu0725@outlook.com"
          git add app/src/main/java/com/weather/metro/ui/rain/RainForecastMapLibre.kt app/src/main/java/com/weather/metro/ui/screens/HomeCurrentScreen.kt
          git commit -m "feat: modernize two-hour forecast and tool labels"
          git push origin HEAD:feature/visual-v3.4-two-hour-forecast
