name: Temporary V3.4 two-hour collapse patch
on:
  push:
    branches:
      - feature/visual-v3.4-two-hour-forecast

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/visual-v3.4-two-hour-forecast
      - name: Apply guarded collapse patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/weather/metro/ui/rain/RainForecastMapLibre.kt')
          s = path.read_text()

          def replace_once(old, new, label):
              global s
              if new in s:
                  return
              if old not in s:
                  raise SystemExit(f'anchor missing: {label}')
              s = s.replace(old, new, 1)

          replace_once(
              'import com.weather.metro.ui.components.MetroGlassContextSurface\n',
              'import com.weather.metro.ui.components.MetroFloatingIsland\nimport com.weather.metro.ui.components.MetroGlassContextSurface\n',
              'floating island import',
          )

          replace_once(
              '    var playing by rememberSaveable { mutableStateOf(false) }\n    var recenterRequest by rememberSaveable { mutableStateOf(0) }\n',
              '    var playing by rememberSaveable { mutableStateOf(false) }\n    var controlsExpanded by rememberSaveable { mutableStateOf(false) }\n    var recenterRequest by rememberSaveable { mutableStateOf(0) }\n',
              'controls state',
          )

          replace_once(
              '        if (!isActive) {\n            playing = false\n            pendingPlaybackIndex = null\n        }\n',
              '        if (!isActive) {\n            playing = false\n            controlsExpanded = false\n            pendingPlaybackIndex = null\n        }\n',
              'inactive collapse',
          )

          old_bottom = '''            val activeTimeline = timeline ?: return@AnimatedVisibility
            val activeFrame = frame ?: return@AnimatedVisibility
            MapLibreTimelineHud(
                timeline = activeTimeline,
                frame = activeFrame,
                selectedIndex = state.forecastFrameIndex ?: activeFrame.frameIndex,
                frameLoading = state.forecastFrame.status == RainResourceStatus.LOADING,
                isStale = state.forecast.isStale || state.forecastFrame.isStale,
                playing = playing,
                accent = accent,
                opacity = displaySettings.opacity,
                playbackSpeed = displaySettings.playbackSpeed,
                canRecenter = state.location != null,
                failedPlaybackIndexes = failedPlaybackIndexes,
                playbackNotice = playbackNotice,
                onTogglePlay = {
                    if (activeTimeline.frames.size >= 2) playing = !playing
                },
                onSelectFrame = { index ->
                    playing = false
                    pendingPlaybackIndex = null
                    failedPlaybackIndexes = failedPlaybackIndexes - index
                    playbackNotice = null
                    desiredLeadMinutes = activeTimeline.frames.getOrNull(index)?.leadMinutes ?: desiredLeadMinutes
                    onSelectFrame(index)
                },
                onOpacityChange = settingsViewModel::setOpacity,
                onPlaybackSpeedChange = { speed ->
                    playing = false
                    settingsViewModel.setPlaybackSpeed(speed)
                },
                onRecenter = { recenterRequest += 1 },
                modifier = Modifier.fillMaxWidth(),
            )
'''
          new_bottom = '''            val activeTimeline = timeline ?: return@AnimatedVisibility
            val activeFrame = frame ?: return@AnimatedVisibility
            val selectedIndex = state.forecastFrameIndex ?: activeFrame.frameIndex
            val togglePlay = {
                if (activeTimeline.frames.size >= 2) playing = !playing
            }
            MetroFloatingIsland(
                expanded = controlsExpanded,
                accent = accent,
                modifier = if (controlsExpanded) Modifier.fillMaxWidth() else Modifier,
                collapsedContent = {
                    Box(
                        modifier = Modifier
                            .size(width = 45.dp, height = 46.dp)
                            .background(accent)
                            .border(1.dp, accent)
                            .clickable(onClick = togglePlay),
                        contentAlignment = Alignment.Center,
                    ) {
                        Text(if (playing) "❚❚" else "▶", color = Color.White, fontSize = 14.sp)
                    }
                    Spacer(Modifier.size(8.dp))
                    Column {
                        Text(
                            text = formatForecastTime(activeTimeline.frames[selectedIndex].validTime),
                            color = Color.White,
                            fontSize = 15.sp,
                            fontWeight = FontWeight.Light,
                        )
                        Text(
                            text = "+${activeTimeline.frames[selectedIndex].leadMinutes} 分 · ${selectedIndex + 1}/${activeTimeline.frames.size}",
                            color = MAPLIBRE_MUTED,
                            fontSize = 9.sp,
                        )
                    }
                    Spacer(Modifier.size(8.dp))
                    MapLibreCompactButton("控制", accent) { controlsExpanded = true }
                },
                expandedContent = {
                    Row(
                        modifier = Modifier.fillMaxWidth(),
                        verticalAlignment = Alignment.CenterVertically,
                    ) {
                        Text(
                            text = "兩小時降雨控制",
                            color = Color.White.copy(alpha = 0.78f),
                            fontSize = 11.sp,
                        )
                        Spacer(Modifier.weight(1f))
                        MapLibreCompactButton("收起", accent) { controlsExpanded = false }
                    }
                    Spacer(Modifier.size(4.dp))
                    MapLibreTimelineHud(
                        timeline = activeTimeline,
                        frame = activeFrame,
                        selectedIndex = selectedIndex,
                        frameLoading = state.forecastFrame.status == RainResourceStatus.LOADING,
                        isStale = state.forecast.isStale || state.forecastFrame.isStale,
                        playing = playing,
                        accent = accent,
                        opacity = displaySettings.opacity,
                        playbackSpeed = displaySettings.playbackSpeed,
                        canRecenter = state.location != null,
                        failedPlaybackIndexes = failedPlaybackIndexes,
                        playbackNotice = playbackNotice,
                        onTogglePlay = togglePlay,
                        onSelectFrame = { index ->
                            playing = false
                            pendingPlaybackIndex = null
                            failedPlaybackIndexes = failedPlaybackIndexes - index
                            playbackNotice = null
                            desiredLeadMinutes = activeTimeline.frames.getOrNull(index)?.leadMinutes ?: desiredLeadMinutes
                            onSelectFrame(index)
                        },
                        onOpacityChange = settingsViewModel::setOpacity,
                        onPlaybackSpeedChange = { speed ->
                            playing = false
                            settingsViewModel.setPlaybackSpeed(speed)
                        },
                        onRecenter = { recenterRequest += 1 },
                        showChrome = false,
                        modifier = Modifier.fillMaxWidth(),
                    )
                },
            )
'''
          replace_once(old_bottom, new_bottom, 'bottom controls island')

          replace_once(
              '    onRecenter: () -> Unit,\n    modifier: Modifier = Modifier,\n) {\n    val timelineListState = rememberLazyListState()\n',
              '    onRecenter: () -> Unit,\n    showChrome: Boolean = true,\n    modifier: Modifier = Modifier,\n) {\n    val timelineListState = rememberLazyListState()\n',
              'timeline showChrome parameter',
          )

          old_surface = '''    Column(
        modifier = modifier
            .fillMaxWidth()
            .background(
                color = Color.Black.copy(alpha = 0.70f),
                shape = RoundedCornerShape(18.dp),
            )
            .border(
                width = 1.dp,
                color = Color.White.copy(alpha = 0.22f),
                shape = RoundedCornerShape(18.dp),
            )
            .padding(horizontal = 11.dp, vertical = 9.dp),
        verticalArrangement = Arrangement.spacedBy(6.dp),
    ) {
'''
          new_surface = '''    val surfaceModifier = if (showChrome) {
        Modifier
            .background(
                color = Color.Black.copy(alpha = 0.70f),
                shape = RoundedCornerShape(18.dp),
            )
            .border(
                width = 1.dp,
                color = Color.White.copy(alpha = 0.22f),
                shape = RoundedCornerShape(18.dp),
            )
            .padding(horizontal = 11.dp, vertical = 9.dp)
    } else {
        Modifier
    }

    Column(
        modifier = modifier
            .fillMaxWidth()
            .then(surfaceModifier),
        verticalArrangement = Arrangement.spacedBy(6.dp),
    ) {
'''
          replace_once(old_surface, new_surface, 'timeline chrome wrapper')

          path.write_text(s)
          PY
      - name: Commit source when changed
        shell: bash
        run: |
          if git diff --quiet -- app/src/main/java/com/weather/metro/ui/rain/RainForecastMapLibre.kt; then
            echo "No source changes required"
            exit 0
          fi
          git config user.name "MaxYu725"
          git config user.email "maxyu0725@outlook.com"
          git add app/src/main/java/com/weather/metro/ui/rain/RainForecastMapLibre.kt
          git commit -m "feat: collapse two-hour forecast controls by default"
          git push origin HEAD:feature/visual-v3.4-two-hour-forecast
