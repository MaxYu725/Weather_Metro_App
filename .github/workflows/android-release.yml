name: Signed Android release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - app/build.gradle.kts
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: signed-android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve application version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts | head -n 1)"
          VERSION_CODE="$(sed -nE 's/^[[:space:]]*versionCode = ([0-9]+).*/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" && "${GITHUB_REF_NAME:-}" != "v$VERSION_NAME" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match app version v${VERSION_NAME}" >&2
            exit 1
          fi
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Resolved Weather Metro $VERSION_NAME ($VERSION_CODE)"

      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/weather-metro-release.jks"

      - name: Build signed full-ABI app bundle
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/weather-metro-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintRelease bundleRelease --stacktrace

      - name: Build signed slim per-ABI APKs
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/weather-metro-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew -PWEATHER_SLIM_RELEASE_APKS=true assembleRelease --stacktrace

      - name: Verify packaging and stage release files
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release
          mkdir -p release
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import shutil
          import zipfile

          version = os.environ["VERSION_NAME"]
          version_code = int(os.environ["VERSION_CODE"])
          expected = {"armeabi-v7a", "arm64-v8a", "x86", "x86_64"}
          apk_paths = sorted(pathlib.Path("app/build/outputs/apk/release").glob("*.apk"))
          if len(apk_paths) != 4:
              raise SystemExit(f"Expected exactly 4 split APKs, found {len(apk_paths)}: {apk_paths}")

          staged = []
          seen = set()
          for apk in apk_paths:
              with zipfile.ZipFile(apk) as archive:
                  native = [
                      info for info in archive.infolist()
                      if info.filename.startswith("lib/") and info.filename.endswith("/libmaplibre.so")
                  ]
                  if len(native) != 1:
                      raise SystemExit(f"{apk}: expected one libmaplibre.so, found {len(native)}")
                  abi = native[0].filename.split("/")[1]
                  if native[0].compress_type == zipfile.ZIP_STORED:
                      raise SystemExit(f"{apk}: libmaplibre.so is still stored uncompressed")
              seen.add(abi)
              target = pathlib.Path("release") / f"WeatherMetro-{version}-{abi}.apk"
              shutil.copy2(apk, target)
              staged.append({"type": "apk", "abi": abi, "path": str(target), "bytes": target.stat().st_size})

          if seen != expected:
              raise SystemExit(f"APK ABI set mismatch: expected {sorted(expected)}, got {sorted(seen)}")

          aabs = list(pathlib.Path("app/build/outputs/bundle/release").glob("*.aab"))
          if len(aabs) != 1:
              raise SystemExit(f"Expected one AAB, found {len(aabs)}")
          with zipfile.ZipFile(aabs[0]) as archive:
              bundle_abis = {
                  info.filename.split("/")[2]
                  for info in archive.infolist()
                  if info.filename.startswith("base/lib/") and info.filename.endswith("/libmaplibre.so")
              }
          if bundle_abis != expected:
              raise SystemExit(
                  f"AAB must retain all ABIs: expected {sorted(expected)}, got {sorted(bundle_abis)}"
              )
          aab_target = pathlib.Path("release") / f"WeatherMetro-{version}.aab"
          shutil.copy2(aabs[0], aab_target)
          staged.append({"type": "aab", "abi": "all", "path": str(aab_target), "bytes": aab_target.stat().st_size})

          manifest = {
              "schemaVersion": 1,
              "versionName": version,
              "versionCode": version_code,
              "commit": os.environ.get("GITHUB_SHA", ""),
              "artifacts": sorted(staged, key=lambda item: item["path"]),
          }
          pathlib.Path("release/release-manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Verify signed APK and AAB identities
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          : > release/SIGNATURES.txt
          for apk in release/*.apk; do
            echo "===== $(basename "$apk") =====" | tee -a release/SIGNATURES.txt
            "$APKSIGNER" verify --verbose --print-certs "$apk" | tee -a release/SIGNATURES.txt
          done
          AAB="$(find release -maxdepth 1 -type f -name '*.aab' | head -n 1)"
          test -n "$AAB"
          jarsigner -verify -certs "$AAB" | tee release/aab-signature-verify.txt
          grep -q "jar verified" release/aab-signature-verify.txt
          echo "===== $(basename "$AAB") =====" >> release/SIGNATURES.txt
          keytool -printcert -jarfile "$AAB" >> release/SIGNATURES.txt

      - name: Generate checksums and size report
        shell: bash
        run: |
          set -euo pipefail
          (
            cd release
            sha256sum WeatherMetro-* > SHA256SUMS.txt
          )
          python3 - <<'PY'
          import json
          import os
          import pathlib

          manifest_path = pathlib.Path("release/release-manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          summary = pathlib.Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a", encoding="utf-8") as handle:
              handle.write(f"### Weather Metro {manifest['versionName']} ({manifest['versionCode']}) signed release\n\n")
              handle.write("| Artifact | Bytes | MiB |\n| --- | ---: | ---: |\n")
              for item in manifest["artifacts"]:
                  size = item["bytes"]
                  handle.write(f"| {pathlib.Path(item['path']).name} | {size} | {size / 1048576:.2f} |\n")
              handle.write("\nAll APK signatures and the AAB JAR signature were verified before upload.\n")
          PY

      - name: Remove decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/weather-metro-release.jks"

      - name: Upload signed release
        uses: actions/upload-artifact@v4
        with:
          name: WeatherMetro-${{ steps.version.outputs.version_name }}-signed
          path: release/
          if-no-files-found: error
          retention-days: 60
